# 节点进程配置样例（A 方）：java ... com.ppcdemo.platform.server.NodeMain deploy/node-server-a.properties
party=A
dbPath=./data/node-a-db
controlPort=18001
mgmtPort=17001
peerBaseUrl=https://peer-host:18002
keyStore=deploy/certs/nodeA.p12
trustStore=deploy/certs/nodeA-trust.p12
storePass=changeit
# 响应方审批策略：允许参与协作的本方数据集（协商白名单）
datasetAllowlist=csv:/data/customers.csv?idCol=0
budgetDefault=10.0
engineTimeoutSeconds=600
